<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="multiplicar.css">

    <!-- Fuente arcade -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <title>Tabla del 3</title>
</head>

<body>
    <div class="pagina">
    <header class="encabezado">
    <p class="autor">CREADO POR DANIEL</p>
    <h2 class="titulo-principal">TABLAS DE MULTIPLICAR</h2>
    <p class="subtitulo">Aprende • Practica • Mejora</p>
</header>
<div class="zona-tabla">

    <section class="selector-tabla">

        <label for="numeroTabla">
            
            <p>escribe el numero de la tabla que quieres ver y  preciona el boton probar para ver esa tabla</p>
            <p class="flecha">⬇</p>
        </label>

        <input
            type="number"
            id="numeroTabla"
            placeholder="Ej: 5"
            min="1"
        >
        <button class="boton-probar" onclick="agregarTablas()">
            PROBAR
        </button>

    </section>

    <main class="contenedor">
        <div id="titulo">
        <h1>Tabla del 3</h1>
        </div>

        <div class="tabla-contenedor">

            <table class="tabla">

                <thead>
                    <tr>
                        <th>Operación</th>
                        <th>Resultado</th>
                    </tr>
                </thead>

                <tbody id="resultadoTablas">
                    <tr>
                        <td>3 × 1</td>
                        <td>3</td>
                    </tr>

                    <tr>
                        <td>3 × 2</td>
                        <td>6</td>
                    </tr>

                    <tr>
                        <td>3 × 3</td>
                        <td>9</td>
                    </tr>

                    <tr>
                        <td>3 × 4</td>
                        <td>12</td>
                    </tr>

                    <tr>
                        <td>3 × 5</td>
                        <td>15</td>
                    </tr>

                    <tr>
                        <td>3 × 6</td>
                        <td>18</td>
                    </tr>

                    <tr>
                        <td>3 × 7</td>
                        <td>21</td>
                    </tr>

                    <tr>
                        <td>3 × 8</td>
                        <td>24</td>
                    </tr>

                    <tr>
                        <td>3 × 9</td>
                        <td>27</td>
                    </tr>

                    <tr>
                        <td>3 × 10</td>
                        <td>30</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </main>
</div>
    </div>
    <script src="multiplicar.js"></script>

</body>
</html>
